name: Run full pipeline with Gemini
# Run this from the GitHub website: Actions tab -> "Run full pipeline with Gemini" -> Run workflow.
# It labels every review with Gemini, writes insights, scores against the answer key,
# and commits the results. Streamlit Cloud then redeploys the dashboard automatically.
on:
  workflow_dispatch:
    inputs:
      trial:
        description: "Label only this many records first (leave empty for the full run)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run pipeline
        timeout-minutes: 90
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Add GEMINI_API_KEY under Settings > Secrets and variables > Actions"; exit 1; fi
          if [ -n "${{ github.event.inputs.trial }}" ]; then
            python -u run_pipeline.py --engine gemini --trial ${{ github.event.inputs.trial }}
          else
            python -u run_pipeline.py --engine gemini
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "voc-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed reports data/cache
          git commit -m "Pipeline results (Gemini)" || echo "Nothing changed"
          git pull --rebase || true
          git push
