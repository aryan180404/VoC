name: Run full pipeline with Gemini

on:
  workflow_dispatch:
    inputs:
      trial:
        description: 'Optional trial count (e.g. 200)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.trial }}" ]; then
            python run_pipeline.py --trial "${{ github.event.inputs.trial }}"
          else
            python run_pipeline.py
          fi
